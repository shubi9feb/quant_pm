name: CI - Tests and Smoke Backtest

on:
  push:
    branches: [ main, develop, feat/*, fix/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov black flake8
    
    - name: Check code formatting with black
      run: |
        black --check --diff . || echo "Black formatting check failed (non-blocking)"
      continue-on-error: true
    
    - name: Lint with flake8
      run: |
        # Stop build on syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Treat all other warnings as non-blocking
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics
      continue-on-error: true
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short --cov=. --cov-report=term-missing
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: success()
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  smoke-backtest:
    name: Smoke Backtest (30 days synthetic)
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create necessary directories
      run: |
        mkdir -p models/saved
        mkdir -p reporting
        mkdir -p audit/logs
    
    - name: Train synthetic model (quick)
      run: |
        python scripts/train_direction_model.py \
          --synth \
          --n-symbols 100 \
          --n-days 200 \
          --no-cv \
          --seed 42
      timeout-minutes: 5
    
    - name: Run 30-day synthetic backtest
      run: |
        python scripts/paper_backtest_walkforward.py \
          --synth \
          --n-days 30 \
          --n-symbols 80 \
          --seed 42
      timeout-minutes: 10
    
    - name: Check backtest output
      run: |
        # Verify summary file created
        ls -lh reporting/walkforward_summary_*.json
        
        # Extract and display key metrics
        python -c "
        import json, glob
        files = glob.glob('reporting/walkforward_summary_*.json')
        if files:
            with open(files[0]) as f:
                m = json.load(f)
            print('='*60)
            print('BACKTEST RESULTS')
            print('='*60)
            print(f'Period: {m[\"start_date\"]} → {m[\"end_date\"]}')
            print(f'Total Return: {m[\"total_return_pct\"]:.2f}%')
            print(f'Sharpe Ratio: {m[\"sharpe_ratio\"]:.4f}')
            print(f'Max Drawdown: {m[\"max_drawdown_pct\"]:.2f}%')
            print(f'Win Rate: {m[\"win_rate_pct\"]:.2f}%')
            print('='*60)
        "
    
    - name: Upload backtest artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backtest-results
        path: |
          reporting/walkforward_*.json
          reporting/walkforward_*.csv
        retention-days: 30

  audit-verification:
    name: Audit Chain Verification
    runs-on: ubuntu-latest
    needs: smoke-backtest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Download backtest artifacts
      uses: actions/download-artifact@v3
      with:
        name: backtest-results
        path: reporting/
    
    - name: Verify audit chain integrity
      run: |
        python -c "
        from audit.logger import AuditVerifier
        import glob, os
        
        # Find audit logs from backtest
        audit_files = glob.glob('audit/logs/audit_*.jsonl')
        
        if audit_files:
            print(f'Found {len(audit_files)} audit files')
            for f in sorted(audit_files):
                date = os.path.basename(f).replace('audit_', '').replace('.jsonl', '')
                result = AuditVerifier.verify_file(f)
                status = '✅ VALID' if result['valid'] else '❌ INVALID'
                print(f'{status} | {date} | {result[\"records\"]} records')
                
                if not result['valid']:
                    print(f'  ERROR: {result[\"errors\"]}')
                    exit(1)
        else:
            print('No audit files found (may not have been created in smoke test)')
        "
